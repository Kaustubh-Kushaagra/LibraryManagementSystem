{% extends "base.html" %}

{% block title %}
Change Password
{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="card shadow-sm">

        <div class="card-header bg-warning">

            <h4 class="mb-0">
                🔑 Change Password
            </h4>

        </div>

        <div class="card-body">

            <form method="post">

                {% csrf_token %}

                <script>
                document.addEventListener("DOMContentLoaded", function () {
                    document.querySelectorAll("input").forEach(function(input) {
                        input.classList.add("form-control");
                    });
                });
                </script>

                {% for field in form %}

                <div class="mb-3">

                    <label class="form-label">

                        {{ field.label }}

                    </label>

                    {{ field }}

                    {% if field.errors %}

                    <div class="text-danger small">

                        {{ field.errors }}

                    </div>

                    {% endif %}

                </div>

                {% endfor %}

                <button
                    class="btn btn-success"
                    type="submit"
                >
                    💾 Change Password
                </button>

                <a
                    href="{% url 'profile' %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
