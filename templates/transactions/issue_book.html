{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-dark text-white py-3">
            <h3>📖 Issue Book</h3>
        </div>

        <div class="card-body">

            <h5 class="mb-3">
                {{ book.title }}
            </h5>

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit"
                        class="btn btn-primary">

                    Issue Book

                </button>

                <a href="{% url 'book_detail' book.accession_number %}"
                   class="btn btn-outline-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
