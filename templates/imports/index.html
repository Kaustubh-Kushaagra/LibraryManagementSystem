{% extends "base.html" %}

{% block title %}
Import Books
{% endblock %}

{% block content %}

<div class="container mt-5">

    <h2 class="mb-4">
        📥 Import Books
    </h2>

    <p class="text-muted mb-4">
        Choose how you want to add books to the library.
    </p>

    <div class="row">

        <div class="col-md-6">

            <div class="card shadow h-100">

                <div class="card-body text-center">

                    <h3>📄</h3>

                    <h4>Import Excel</h4>

                    <p class="text-muted">
                        Upload multiple books from an Excel spreadsheet.
                    </p>

                    <a
                        href="{% url 'upload_excel' %}"
                        class="btn btn-primary"
                    >
                        Open
                    </a>

                </div>

            </div>

        </div>

        <div class="col-md-6">

            <div class="card shadow h-100">

                <div class="card-body text-center">

                    <h3>✍️</h3>

                    <h4>Add Single Book</h4>

                    <p class="text-muted">
                        Add one book manually.
                    </p>

                    <a
                        href="{% url 'manual_book_add' %}"
                        class="btn btn-success"
                    >
                        Open
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
